<?xml version="1.0" encoding="UTF-8"?>

<svg
    width="1000"
    height="200"
    viewBox="0 0 1000 200"
    xmlns="http://www.w3.org/2000/svg">

<defs>

<!-- ============================= -->
<!-- COLORS -->
<!-- ============================= -->

<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#050816"/>
    <stop offset="45%" stop-color="#0B1120"/>
    <stop offset="100%" stop-color="#020617"/>
</linearGradient>

<linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#8B5CF6"/>
    <stop offset="50%" stop-color="#3B82F6"/>
    <stop offset="100%" stop-color="#22D3EE"/>
</linearGradient>

<linearGradient id="borderGradient"
                x1="0%"
                y1="0%"
                x2="100%"
                y2="100%">

    <stop offset="0%" stop-color="#3B82F6"/>
    <stop offset="50%" stop-color="#8B5CF6"/>
    <stop offset="100%" stop-color="#22D3EE"/>

</linearGradient>

<!-- ============================= -->
<!-- GLASS -->
<!-- ============================= -->

<filter id="glassBlur">

    <feGaussianBlur
        stdDeviation="12"
        result="blur"/>

</filter>

<filter id="softGlow">

    <feGaussianBlur
        stdDeviation="8"
        result="blur"/>

    <feMerge>

        <feMergeNode in="blur"/>

        <feMergeNode in="SourceGraphic"/>

    </feMerge>

</filter>

<filter id="strongGlow">

    <feGaussianBlur
        stdDeviation="20"
        result="blur"/>

    <feMerge>

        <feMergeNode in="blur"/>

        <feMergeNode in="SourceGraphic"/>

    </feMerge>

</filter>

<!-- ============================= -->
<!-- SHADOW -->
<!-- ============================= -->

<filter id="shadow">

    <feDropShadow
        dx="0"
        dy="12"
        stdDeviation="12"
        flood-color="#000000"
        flood-opacity="0.35"/>

</filter>

<!-- ============================= -->
<!-- GRID -->
<!-- ============================= -->

<pattern
    id="grid"
    width="40"
    height="40"
    patternUnits="userSpaceOnUse">

    <path
        d="M40 0H0V40"
        fill="none"
        stroke="#162033"
        stroke-width="1"/>

</pattern>

<!-- ============================= -->
<!-- DOTS -->
<!-- ============================= -->

<pattern
    id="dots"
    width="20"
    height="20"
    patternUnits="userSpaceOnUse">

    <circle
        cx="2"
        cy="2"
        r="1"
        fill="#1E293B"/>

</pattern>

</defs>

<!-- ================================================= -->
<!-- BACKGROUND -->
<!-- ================================================= -->

<rect
    width="1000"
    height="200"
    fill="url(#bg)"/>

<!-- subtle grid -->

<rect
    width="1000"
    height="200"
    fill="url(#grid)"
    opacity=".15"/>

<!-- ================================================= -->
<!-- DECORATIONS -->
<!-- ================================================= -->

<circle
    cx="870"
    cy="30"
